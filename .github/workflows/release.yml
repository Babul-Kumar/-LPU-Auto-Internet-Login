# ─── GitHub Actions: Build & Release ─────────────────────────────────────────
#
# Triggers on: push of a version tag  →  v1.0.0, v1.2.3, etc.
#
# Workflow:
#   1. Install dependencies
#   2. Run "npm run build"  →  produces dist/
#   3. Run "npm run zip"    →  produces dist/extension.zip
#   4. Create a GitHub Release with the ZIP attached
#
# How to trigger a release:
#   git tag v1.0.0
#   git push origin v1.0.0

name: Build & Release Extension

on:
  push:
    tags:
      - 'v*.*.*'   # matches v1.0.0, v2.1.3, etc.

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build-and-release:
    name: Build, Zip & Release
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ───────────────────────────────────────────────────
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── 3. Install dependencies ─────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Build (Vite + Terser minification) ───────────────────────────────
      - name: Build production bundle
        run: npm run build

      # ── 5. Zip the dist/ folder ─────────────────────────────────────────────
      - name: Create extension.zip
        run: npm run zip

      # ── 6. Read version from tag ────────────────────────────────────────────
      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      # ── 7. Create GitHub Release with ZIP attached ──────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "LPU Auto Internet Login ${{ steps.version.outputs.VERSION }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## 🚀 LPU Auto Internet Login ${{ steps.version.outputs.VERSION }}

            ### Installation
            1. Download **extension.zip** below
            2. Unzip it to a folder
            3. Open Chrome → `chrome://extensions`
            4. Enable **Developer Mode** (top-right toggle)
            5. Click **Load unpacked** → select the unzipped folder
            6. Click the extension icon → enter your LPU credentials → done!

            ### How it works
            - Connects to WiFi → internet works in **5–10 seconds**, automatically
            - **100% silent** — no popup notifications, no visible tabs, nothing
            - To check what it did, click the extension icon → Activity Log
            - If login fails it retries automatically: 5s → 15s → 30s → 60s

            ### What's included
            - Minified production build (source code not included)
            - Zero notifications — works entirely in the background
            - No data ever leaves your device

            ---
            > ⚠️ Always download from **Releases** — not "Source code (zip)" links.
          files: dist/extension.zip
          draft: false
          prerelease: false
